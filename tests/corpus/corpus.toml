# Catalogs compiled by Apple's actool, kept in samples/<name>/Assets.car (Git LFS), with the
# inputs they were compiled from in sources/<name>/ where they are public. `url` (and
# `ipa_member` for an app archive) and `sources` record where each file came from.
# Samples with `app_icon` are compile pairs: tests/corpus_parity.rs compiles their sources with
# that `--app-icon`, the platform and deployment target stored in the sample, and `args`.
# Third-party marks under their projects' licences: see README.md.

