# iOS, Xcode 26.2. Settings from LiveContainer.xcodeproj at the tag.
[[sample]]
name = "ios/livecontainer"
url = "https://github.com/LiveContainer/LiveContainer/releases/download/3.8.0/LiveContainer.ipa"
ipa_member = "Payload/LiveContainer.app/Assets.car"
app_icon = "AppIcon"
args = ["--accent-color", "AccentColor", "--include-all-app-icons", "--target-device", "iphone", "--target-device", "ipad"]
sources = [
    "https://raw.githubusercontent.com/LiveContainer/LiveContainer/3.8.0/Resources/Assets.xcassets",
]

# iOS, Xcode 27.1: an Icon Composer icon and an asset catalog in one invocation.
# Settings from UTM.xcodeproj (UTM Remote target) at the tag.
[[sample]]
name = "ios/utm-remote"
url = "https://github.com/utmapp/UTM/releases/download/v5.0.8/UTM-Remote.ipa"
ipa_member = "Payload/UTM Remote.app/Assets.car"
app_icon = "AppIcon-Remote"
args = ["--accent-color", "AccentColor-Remote", "--include-all-app-icons", "--target-device", "iphone", "--target-device", "ipad"]
sources = [
    "https://raw.githubusercontent.com/utmapp/UTM/v5.0.8/Platform/AppIcon-Remote.icon",
    "https://raw.githubusercontent.com/utmapp/UTM/v5.0.8/Platform/Assets.xcassets",
]
