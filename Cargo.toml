[package]
name = "accord"
version = "2.2.4"
edition = "2021"
description = "Linux replacement for Apple's actool: compiles xcassets and Icon Composer icons into Assets.car"
license = "MIT"

[[bin]]
name = "accord"
path = "src/main.rs"

[lib]
name = "accord"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"
lzfse = "0.2"
flate2 = "1"
plist = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
byteorder = "1"
anyhow = "1"
thiserror = "2"
quick-xml = { version = "0.38", features = ["serialize"] }
regex = "1"
resvg = "0.48.1"
hayro = "0.5" # 0.6 needs rustc 1.92
moxcms = "0.8"
half = "2"

[dev-dependencies]
tempfile = "3"
toml = "1.1.8"
